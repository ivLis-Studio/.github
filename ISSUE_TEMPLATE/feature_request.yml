name: Feature request / 기능 제안
description: Suggest an idea for ivLyrics. ivLyrics에 아이디어를 제안합니다.
title: "[FEATURE REQUEST] "
labels: ["Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and the Discord feature-request channel first. For larger changes, agree on the idea here before opening a pull request.

        먼저 기존 이슈와 Discord 기능 제안 채널을 확인해 주세요. 큰 변경은 PR 전에 여기서 방향을 먼저 맞춰 주세요.
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 플랫폼
      multiple: true
      options:
        - PC (Spicetify)
        - Android app
        - Android LSPatch module
        - iOS app
        - ivLyrics Overlay
        - ivLyrics Helper
        - Server or website (ivl.is) / 서버·웹사이트
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 어떤 불편을 해결하나요?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 제안하는 방법
      description: How should it work? Sketches and examples help. / 어떻게 동작하면 좋을까요? 스케치나 예시가 도움이 됩니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 고려한 다른 방법
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 제출 전 확인
      options:
        - label: I searched existing issues and the Discord feature-request channel. / 기존 이슈와 Discord 기능 제안을 확인했습니다.
          required: true
